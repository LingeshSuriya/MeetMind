<!DOCTYPE html>
<html>
<head>
    <title>MeetMind Integration</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            width: 300px;
            padding: 16px;
            background-color: #f8fafc;
            color: #0f172a;
            margin: 0;
        }
        h2 {
            margin-top: 0;
            font-size: 18px;
            color: #0ea5e9;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        p {
            font-size: 13px;
            color: #64748b;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 4px;
        }
        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #0ea5e9;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #0284c7;
        }
        button:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }
        .status {
            margin-top: 12px;
            font-size: 12px;
            font-weight: 500;
            text-align: center;
        }
        .error { color: #ef4444; }
        .success { color: #10b981; }
    </style>
</head>
<body>
    <h2>MeetMind GMeet</h2>
    <p>Ensure Closed Captions (CC) are turned ON in your Google Meet call.</p>
    
    <div class="form-group">
        <label>Meeting Title</label>
        <input type="text" id="meetingTitle" placeholder="e.g. Q3 Sync">
    </div>

    <button id="analyzeBtn">Analyze Meeting & Send</button>
    <button id="clearBtn" style="background-color: #ef4444; margin-top: 8px;">Clear Local Transcript</button>
    
    <div id="statusMsg" class="status"></div>

    <script src="popup.js"></script>
</body>
</html>
