<!DOCTYPE html>
<html>
<head>
    <title>MeetMind Integration</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            width: 320px;
            padding: 16px;
            background-color: #f8fafc;
            color: #0f172a;
            margin: 0;
        }
        h2 {
            margin-top: 0;
            font-size: 18px;
            color: #0ea5e9;
        }
        p {
            font-size: 12px;
            color: #64748b;
            margin: 0 0 12px 0;
        }
        .tip {
            background: #fef9c3;
            border-left: 3px solid #eab308;
            border-radius: 4px;
            padding: 8px 10px;
            font-size: 11px;
            color: #713f12;
            margin-bottom: 12px;
            line-height: 1.5;
        }
        .form-group { margin-bottom: 12px; }
        label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 4px;
        }
        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #0ea5e9;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 6px;
        }
        button:hover { background-color: #0284c7; }
        button:disabled { background-color: #94a3b8; cursor: not-allowed; }
        #clearBtn   { background-color: #ef4444; }
        #clearBtn:hover { background-color: #dc2626; }
        #debugBtn   { background-color: #6366f1; font-size: 12px; padding: 7px; }
        #debugBtn:hover { background-color: #4f46e5; }
        .status {
            margin-top: 10px;
            font-size: 12px;
            font-weight: 500;
            text-align: center;
        }
        .error   { color: #ef4444; }
        .success { color: #10b981; }
        #debugBox {
            margin-top: 10px;
            background: #1e293b;
            color: #94a3b8;
            font-size: 10px;
            font-family: monospace;
            padding: 8px;
            border-radius: 6px;
            max-height: 120px;
            overflow-y: auto;
            white-space: pre-wrap;
            display: none;
        }
        .counter {
            display: inline-block;
            background: #0d7377;
            color: white;
            border-radius: 12px;
            padding: 2px 10px;
            font-size: 11px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <h2>MeetMind GMeet</h2>

    <div class="tip">
        ⚠️ <strong>CC ≠ Chat.</strong> Closed Captions (CC) must be ON.<br>
        Click <strong>⋮ More options → Turn on captions</strong> in Meet.<br>
        You'll see a white text box appear on the video — that's CC.
    </div>

    <div id="captureCounter" class="counter">0 lines captured</div>

    <div class="form-group">
        <label>Meeting Title</label>
        <input type="text" id="meetingTitle" placeholder="e.g. Q3 Sync">
    </div>

    <button id="analyzeBtn">Analyze Meeting &amp; Send</button>
    <button id="clearBtn">Clear Local Transcript</button>
    <button id="debugBtn">🔍 Debug: What am I seeing?</button>

    <div id="statusMsg" class="status"></div>
    <div id="debugBox"></div>

    <script src="popup.js"></script>
</body>
</html>
