<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MeetMind</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            width: 340px;
            background: #f8fafc;
            color: #0f172a;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #0ea5e9 0%, #6366f1 100%);
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header-left { display: flex; align-items: center; gap: 8px; }
        .logo { font-size: 20px; }
        .header h2 { color: #fff; font-size: 16px; font-weight: 700; }
        .header .sub { color: rgba(255,255,255,0.75); font-size: 11px; }
        .badge {
            background: rgba(255,255,255,0.2);
            color: #fff;
            border-radius: 20px;
            padding: 3px 10px;
            font-size: 11px;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.3);
            white-space: nowrap;
        }
        .badge.active { background: rgba(26,122,48,0.8); border-color: #1a7a30; }

        /* Status bar */
        .status-bar {
            background: #fef9c3;
            border-bottom: 1px solid #fde68a;
            padding: 7px 12px;
            font-size: 11px;
            color: #713f12;
            line-height: 1.4;
        }
        .status-bar strong { font-weight: 600; }

        /* Live preview */
        .preview-section {
            background: #fff;
            border-bottom: 1px solid #e2e8f0;
        }
        .preview-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: #f1f5f9;
            border-bottom: 1px solid #e2e8f0;
        }
        .preview-header span { font-size: 11px; font-weight: 600; color: #475569; }
        .preview-header button {
            font-size: 10px;
            padding: 2px 8px;
            background: #e2e8f0;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            color: #475569;
        }
        .preview-header button:hover { background: #cbd5e1; }
        #livePreview {
            min-height: 80px;
            max-height: 130px;
            overflow-y: auto;
            padding: 8px 12px;
            font-size: 11px;
            line-height: 1.5;
        }
        .preview-line {
            margin-bottom: 4px;
            padding: 3px 6px;
            border-radius: 4px;
            background: #f8fafc;
            border-left: 2px solid #0ea5e9;
        }
        .preview-line .spk { font-weight: 600; color: #0ea5e9; margin-right: 4px; }
        .preview-line .txt { color: #334155; }
        .preview-empty { color: #94a3b8; font-style: italic; text-align: center; padding: 16px 0; }

        /* Form */
        .form-section { padding: 12px; }
        .form-group { margin-bottom: 8px; }
        label { display: block; font-size: 11px; font-weight: 600; color: #475569; margin-bottom: 4px; }
        input {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 13px;
            background: #fff;
        }
        input:focus { outline: none; border-color: #0ea5e9; box-shadow: 0 0 0 2px rgba(14,165,233,0.15); }

        /* Buttons */
        .btn-group { display: flex; flex-direction: column; gap: 6px; }
        .btn {
            width: 100%;
            padding: 9px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-primary { background: #0ea5e9; color: #fff; }
        .btn-primary:hover:not(:disabled) { background: #0284c7; }
        .btn-row { display: flex; gap: 6px; }
        .btn-row .btn { flex: 1; font-size: 12px; padding: 7px; }
        .btn-danger  { background: #fee2e2; color: #dc2626; }
        .btn-danger:hover:not(:disabled)  { background: #fecaca; }
        .btn-secondary { background: #f1f5f9; color: #475569; }
        .btn-secondary:hover:not(:disabled) { background: #e2e8f0; }
        .btn-purple { background: #ede9fe; color: #7c3aed; }
        .btn-purple:hover:not(:disabled) { background: #ddd6fe; }

        /* Status message */
        #statusMsg {
            margin: 6px 12px 0;
            padding: 7px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            display: none;
        }
        #statusMsg.error   { background: #fee2e2; color: #dc2626; display: block; }
        #statusMsg.success { background: #dcfce7; color: #16a34a; display: block; }
        #statusMsg.info    { background: #dbeafe; color: #1d4ed8; display: block; }

        /* Debug box */
        #debugBox {
            margin: 6px 12px;
            background: #1e293b;
            color: #94a3b8;
            font-size: 10px;
            font-family: monospace;
            padding: 8px;
            border-radius: 6px;
            max-height: 130px;
            overflow-y: auto;
            white-space: pre-wrap;
            display: none;
        }

        .footer {
            padding: 8px 12px;
            font-size: 10px;
            color: #94a3b8;
            text-align: center;
            border-top: 1px solid #e2e8f0;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <span class="logo">🧠</span>
            <div>
                <h2>MeetMind</h2>
                <div class="sub">Google Meet Intelligence</div>
            </div>
        </div>
        <div id="captureCounter" class="badge">0 lines</div>
    </div>

    <div class="status-bar">
        ⚠️ <strong>Make sure CC is ON:</strong> ⋮ More options → <strong>Turn on captions</strong>
    </div>

    <!-- Live preview -->
    <div class="preview-section">
        <div class="preview-header">
            <span>📝 Live Transcript Preview</span>
            <button id="copyBtn">Copy All</button>
        </div>
        <div id="livePreview">
            <div class="preview-empty">Nothing captured yet. Start speaking in Meet.</div>
        </div>
    </div>

    <!-- Form -->
    <div class="form-section">
        <div class="form-group">
            <label>Meeting Title</label>
            <input type="text" id="meetingTitle" placeholder="e.g. Q3 Sync, Sprint Planning…">
        </div>

        <div class="btn-group">
            <button id="analyzeBtn" class="btn btn-primary">
                ✨ Analyze &amp; Save Meeting
            </button>
            <div class="btn-row">
                <button id="clearBtn" class="btn btn-danger">🗑 Clear</button>
                <button id="viewDashBtn" class="btn btn-secondary">📊 Dashboard</button>
                <button id="debugBtn" class="btn btn-purple">🔍 Debug</button>
            </div>
        </div>

        <div id="statusMsg"></div>
        <div id="debugBox"></div>
    </div>

    <div class="footer">MeetMind v1.1 — backend: localhost:3000</div>

    <script src="popup.js"></script>
</body>
</html>
